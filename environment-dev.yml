  - mypy >=2.3.0
  - numpydoc >=1.10.0
  - pandas >=2.2.0
  - prek >=0.4.0
  - pytest >=9.0.2
  - pytest-cov >=7.0.0
  - ruff >=0.15.3
  - tox >=4.52.0
  - tox-gh >=1.7.1
